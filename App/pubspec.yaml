name: agrhi
description: "Smart Farming Solutions - Offline-First Agricultural App"
publish_to: none
version: 1.2.0+3

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Core
  package_info_plus: ^9.0.1
  uuid: ^4.5.3
  path: any
  http_parser: any
  quiver: ^3.2.2

  # Storage & Caching
  path_provider: ^2.1.4
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.4.2

  # Networking & API
  http: ^1.6.0
  dio: ^5.9.2
  connectivity_plus: ^7.1.0
  internet_connection_checker_plus: ^2.9.1+2
  url_launcher: ^6.3.2
  timeago: ^3.6.1

  # State Management
  provider: ^6.1.2

  # Authentication
  jwt_decoder: ^2.0.1

  # Camera & Media Picker
  camera: ^0.11.4
  image_picker: ^1.2.1
  crop_image: ^1.0.13

  # Image Processing
  image: ^4.8.0
  flutter_image_compress: ^2.3.0

  # Video
  video_player: ^2.10.1
  video_thumbnail: ^0.5.3
  video_compress: ^3.1.2
  ffmpeg_kit_flutter_new: ^4.1.0

  # ML & AI
  tflite_flutter: ^0.11.0
  google_mlkit_translation: ^0.13.1

  # Location & Maps
  geolocator: ^12.0.0
  geocoding: ^4.0.0
  permission_handler: ^12.0.1
  open_meteo: ^3.0.0
  flutter_map: ^8.2.1
  flutter_map_cache: ^2.0.0+1
  latlong2: ^0.9.0

  # Image Caching
  flutter_cache_manager: ^3.4.1
  cached_network_image: ^3.3.1

  # Internationalisation
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/

flutter_launcher_icons:
  android: launcher_icons
  ios: true
  image_path: assets/images/logo.png
  remove_alpha_ios: true
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: assets/images/logo.png