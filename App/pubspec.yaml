name: AGRHI
description: "Smart Farming Solutions - Offline-First Agricultural App"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Core Flutter Packages
  package_info_plus: ^8.1.2
  
  # Storage & Caching 
  path_provider: ^2.1.4
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3                  
  hive_flutter: ^1.1.0         
  sqflite: ^2.4.2
  
  # State Management & Utilities
  provider: ^6.1.2
  
  # Networking & API
  http: ^1.2.2
  dio: ^5.9.0
  connectivity_plus: ^7.0.0
  internet_connection_checker_plus: ^2.9.0
  url_launcher: ^6.3.2
  
  # Authentication & Security
  jwt_decoder: ^2.0.1
  
  # ML & Image Processing
  camera: ^0.11.3
  tflite_flutter: ^0.11.0
  image: ^4.3.0
  image_picker: ^1.2.0
  google_mlkit_translation: ^0.13.0
  
  # Location Services
  geolocator: ^12.0.0   
  permission_handler: ^12.0.1
  geocoding: ^4.0.0
  open_meteo: ^3.0.0

  # Map Integration
  flutter_map: ^8.2.1
  flutter_map_cache: ^2.0.0+1
  latlong2: ^0.9.0    
  
  # Internationalization & Formatting
  intl: ^0.20.2
  
  # Memory Cache (LRU)
  quiver: ^3.2.2
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/
    
flutter_launcher_icons:
  android: "launcher_icons"
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/logo.png"
