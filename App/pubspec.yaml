name: agrhi
description: "Smart Farming Solutions - Offline-First Agricultural App"
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  jwt_decoder: ^2.0.1 
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  http: ^1.5.0
  tflite_flutter: ^0.11.0
  image: ^4.5.4
  image_picker: ^1.2.0
  open_meteo: ^3.0.0
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  geocoding: ^4.0.0
  google_mlkit_translation: ^0.13.0
  dio: ^5.9.0
  flutter_launcher_icons: ^0.14.4 
  url_launcher: ^6.1.10
  connectivity_plus: ^7.0.0
  internet_connection_checker_plus: ^2.9.0
  intl: ^0.20.2
  sqflite: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  dart_code_metrics: ^4.19.2

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/
    
flutter_launcher_icons:
  android: "launcher_icons"
  ios: true
  image_path: "assets/images/logo_nb.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/logo_nb.png"
